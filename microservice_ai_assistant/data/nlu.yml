version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Привет
      - Здравствуйте
      - Добрый день
      - Приветствую
      - Доброе утро

  - intent: goodbye
    examples: |
      - До свидания
      - Пока
      - Увидимся
      - Всего доброго
      - До встречи
      - Спасибо за информацию

  - intent: ask_architecture
    examples: |
      - Расскажите об архитектуре ПО
      - Какие подходы существуют в архитектуре?
      - Что такое микросервисная архитектура?
      - Как выбрать архитектуру ПО?
      - Как выбрть архитектуру для проекта?

  - intent: affirm
    examples: |
      - Да
      - Верно
      - Именно
      - Точно
      - Согласен

  - intent: deny
    examples: |
      - Нет
      - Не нужно
      - Неверно
      - Не согласен

  - intent: request_info
    examples: |
      - Расскажите больше об этом
      - Можете уточнить?
      - Какие есть детали?
      - Какие есть варианты?
      - Можно больше информации?

  - intent: ask_microservices_flexibility
    examples: |
      - Какие плюсы у микросервисов?
      - Как микросервисы обеспечивают гибкость?
      - Почему микросервисы гибкие?

  - intent: ask_monolith_to_microservices
    examples: |
      - Как разделить монолит на микросервисы?
      - Что нужно для миграции монолита на микросервисы?
      - Как начать переход на микросервисы?