version: "3.1"

intents:
  - greet
  - goodbye
  - ask_architecture
  - ask_microservices_flexibility
  - ask_monolith_to_microservices
  - request_info

responses:
  utter_greet:
    - text: "Привет! Чем могу помочь в области архитектуры программного обеспечения?"
  
  utter_goodbye:
    - text: "До свидания! Если появятся вопросы по архитектуре ПО, обращайтесь."

  utter_ask_more:
    - text: "Что именно вас интересует в архитектуре программного обеспечения?"
  
  utter_acknowledge:
    - text: "Понял, расскажите подробнее о вашем проекте или задачах."

  utter_architecture_response:
    - text: "Архитектура ПО включает выбор структур, которые обеспечивают масштабируемость, гибкость и поддерживаемость приложения. Задайте конкретный вопрос по этой теме, и я помогу вам с информацией."

  utter_microservices_flexibility:
    - text: "Микросервисы обеспечивают гибкость благодаря независимости компонентов, их автономности и возможности разрабатывать и масштабировать их независимо."

  utter_monolith_to_microservices:
    - text: "Для перехода с монолита на микросервисы необходимо выделить независимые модули, организовать их взаимодействие через API и использовать такие инструменты, как Kubernetes и Docker."

entities:
  - topic

slots:
  topic:
    type: text
    influence_conversation: false
    mappings:
        - type: from_text

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true